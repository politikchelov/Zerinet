<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>ZERINET</title>
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --text:#e8eaf0; --muted:#8b92a3;
  --accent:#8b5cf6; --accent2:#a78bfa; --danger:#f87171; --radius:14px;
}
[data-theme=sakura]{--bg:#140f13;--panel:#1f171d;--panel2:#2b2028;--accent:#ec4899;--accent2:#f9a8d4;--muted:#a58b99}
[data-theme=ocean]{--bg:#0a1117;--panel:#111b24;--panel2:#1a2835;--accent:#0ea5e9;--accent2:#7dd3fc;--muted:#8097a8}
[data-theme=sunset]{--bg:#140e0a;--panel:#201711;--panel2:#2d2218;--accent:#f97316;--accent2:#fdba74;--muted:#a8927f}
[data-theme=matcha]{--bg:#0c120e;--panel:#131c16;--panel2:#1c2a20;--accent:#22c55e;--accent2:#86efac;--muted:#82a08a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);transition:background .4s}
body{margin:0;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--panel2)}
.logo{font-weight:800;letter-spacing:.1em;font-size:19px;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
#mnav{display:flex;gap:4px;flex-wrap:wrap}
#mnav a{padding:6px 10px;border-radius:8px;color:var(--muted)}
#mnav a:hover{background:var(--panel2);color:var(--text)}
#searchForm{flex:1;display:flex;gap:8px;max-width:460px;margin-left:auto;min-width:200px}
#q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--panel2);border-radius:999px;padding:8px 14px;outline:none}
#q:focus{border-color:var(--accent)}
.btn{background:var(--panel2);border:0;border-radius:10px;padding:8px 12px;cursor:pointer;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.on,.btn.primary{background:var(--accent);color:#fff}
.btn.big{padding:11px 22px;font-weight:600;border-radius:12px}
main{max-width:1240px;margin:0 auto;padding:14px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
main>*{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2{margin:8px 0 12px}
h2{font-size:19px}
.sech{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.sech h2{margin:0}
.sech a{margin-left:auto;color:var(--accent2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin}
.hrow .card{flex:0 0 150px;scroll-snap-align:start}
.card{background:var(--panel);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px #0008}
.pw{position:relative;aspect-ratio:2/3;background:var(--panel2);overflow:hidden}
.poster{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .poster{transform:scale(1.07)}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:linear-gradient(transparent 40%,#000a);opacity:0;transition:opacity .2s}
.card:hover .play{opacity:1}
.bds{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.bdg{background:#000b;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;backdrop-filter:blur(4px)}
.bdg.live{background:var(--accent)}
.card .info{padding:8px 10px 10px}
.card .t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--muted);font-size:12px;margin-top:2px}
.msg{padding:28px 10px;text-align:center;color:var(--muted)}
.msg.err{color:var(--danger)}
/* hero */
.hero,.thero{position:relative;border-radius:18px;overflow:hidden;background:var(--panel)}
.hero{min-height:300px}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.slide.on{opacity:1;pointer-events:auto}
.bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.45) saturate(1.3);transform:scale(1.1)}
.hc{position:relative;display:flex;gap:22px;align-items:center;padding:22px}
.hp{width:170px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:0 12px 36px #000a;flex:none;background:var(--panel2)}
.ht{min-width:0}
.ht h1{margin:6px 0;font-size:clamp(22px,4vw,36px);line-height:1.15}
.ht p{color:#d3d7e2;max-width:640px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 14px}
.sub{color:#c9cdd8;opacity:.8;margin-bottom:6px}
.dots{position:absolute;right:16px;bottom:12px;display:flex;gap:6px;z-index:2}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#fff5;cursor:pointer;padding:0}
.dots button.on{background:var(--accent2);width:22px;border-radius:6px}
.thero .hc{padding:18px}
.thero .hp{width:130px}
/* skeleton */
.sk-hero,.sk-card{border-radius:var(--radius);background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 37%,var(--panel) 63%);background-size:400% 100%;animation:shine 1.3s infinite}
.sk-hero{height:300px;margin-bottom:20px}.sk-card{aspect-ratio:2/3.4}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
/* title page */
.layout{display:grid;gap:16px;grid-template-columns:1fr;margin-top:16px}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 320px}}
.player{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.sel{background:var(--panel2);border:0;border-radius:8px;padding:8px 10px;max-width:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(0,0,0,.72);color:#fff;font-size:14px}
.skip{position:absolute;right:12px;bottom:58px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row .sp{margin-left:auto}
.eps{background:var(--panel);border-radius:var(--radius);padding:10px;max-height:420px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;align-content:start}
.eps .btn{padding:8px 0;text-align:center}
.box{background:var(--panel);border-radius:var(--radius);padding:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:#ffffff1a;border-radius:999px;padding:2px 10px;font-size:12px;color:#dfe3ee}
.layout .tag,.box .tag{background:var(--panel2);color:var(--muted)}
.desc{color:#c9cdd8;white-space:pre-line}
footer{color:var(--muted);text-align:center;font-size:12px;padding:20px}
footer a{text-decoration:underline}
.flash{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:999px;z-index:60;box-shadow:0 8px 24px #000a;animation:fade .25s}
@media(max-width:640px){.hc{flex-direction:column;align-items:flex-start;padding:16px}.hp{width:110px}.hero{min-height:420px}#mnav a{padding:6px 8px}}

/* ---------- визуальные улучшения ---------- */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 18% 12%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),
             radial-gradient(35% 30% at 86% 22%,color-mix(in srgb,var(--accent2) 17%,transparent),transparent 70%),
             radial-gradient(42% 40% at 60% 92%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(3%,2%,0) scale(1.1) rotate(2deg)}}
::selection{background:color-mix(in srgb,var(--accent) 50%,transparent)}
*{scrollbar-color:var(--panel2) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:9px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;opacity:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent)}
#bar.on{opacity:1;width:75%;transition:width 6s cubic-bezier(.1,.7,.2,1)}
#bar.done{width:100%;opacity:0;transition:width .2s,opacity .45s .2s}
.logo{text-shadow:0 0 24px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,var(--accent2)));box-shadow:0 4px 16px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{box-shadow:0 6px 22px -2px color-mix(in srgb,var(--accent) 85%,transparent)}
.sech h2::before{content:"";display:inline-block;width:4px;height:1em;border-radius:3px;margin-right:10px;vertical-align:-2px;background:linear-gradient(var(--accent2),var(--accent))}
.box,.eps{border:1px solid color-mix(in srgb,var(--text) 7%,transparent);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(8px)}
.card{border:1px solid color-mix(in srgb,var(--text) 6%,transparent);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,box-shadow .25s}
.card:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-5px);box-shadow:0 14px 34px -8px color-mix(in srgb,var(--accent) 45%,#000)}
.player{box-shadow:0 22px 70px -22px color-mix(in srgb,var(--accent) 60%,transparent)}
.slide.on .bg{animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1.28) translate(-2%,-1.5%)}}
.prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:2}
.slide.on .prog{animation:prog 6.5s linear forwards}
@keyframes prog{to{width:100%}}
.hero:hover .prog{animation-play-state:paused}
.msg:not(.err):not(:has(button)):not(:has(a))::before{content:"✨";display:block;font-size:26px;margin-bottom:6px}


/* Decorative falling leaves overlay; site layout and functionality remain unchanged. */
#zr-falling-leaves{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9999;contain:strict}
.zr-fall-leaf{position:absolute;top:-12vh;left:var(--left);width:var(--size);height:calc(var(--size)*.68);border-radius:100% 0 100% 0;background:linear-gradient(135deg,var(--leaf-light),var(--leaf-color) 65%,var(--leaf-dark));opacity:var(--opacity);transform:rotate(var(--angle));box-shadow:inset -1px -1px 2px #0002;animation:zr-leaf-fall var(--duration) linear var(--delay) infinite;will-change:transform,top}
.zr-fall-leaf:after{content:"";position:absolute;left:12%;top:49%;width:78%;height:1px;background:#fff8;transform:rotate(-22deg);transform-origin:left center}
@keyframes zr-leaf-fall{0%{top:-12vh;margin-left:0;transform:rotate(var(--angle)) translateX(0)}25%{margin-left:var(--sway);transform:rotate(calc(var(--angle) + 100deg)) translateX(12px)}50%{margin-left:calc(var(--sway)*-.55);transform:rotate(calc(var(--angle) + 230deg)) translateX(-8px)}75%{margin-left:var(--sway);transform:rotate(calc(var(--angle) + 330deg)) translateX(10px)}100%{top:112vh;margin-left:0;transform:rotate(calc(var(--angle) + 480deg)) translateX(0)}}
@media(prefers-reduced-motion:reduce){#zr-falling-leaves{display:none}}


/* Release countdown: isolated feature, existing layout and behavior unchanged */
.release-panel{margin:22px 0;padding:16px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--panel2));border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel));}
.release-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.release-head h2{margin:0}.release-head .release-note{color:var(--muted);font-size:12px}
.release-form{display:grid;grid-template-columns:minmax(180px,2fr) minmax(190px,1.3fr) minmax(90px,.6fr) auto;gap:8px;margin:12px 0 14px}
.release-form select,.release-form input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--panel2);border-radius:9px;padding:9px 10px;outline:none}
.release-form select:focus,.release-form input:focus{border-color:var(--accent)}
.release-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.release-item{display:flex;gap:11px;align-items:center;min-width:0;padding:10px;background:color-mix(in srgb,var(--panel2) 72%,transparent);border:1px solid color-mix(in srgb,var(--text) 6%,transparent);border-radius:12px}
.release-poster{width:54px;height:76px;flex:none;object-fit:cover;border-radius:7px;background:var(--panel2)}
.release-info{min-width:0;flex:1}.release-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.release-episode{font-size:12px;color:var(--muted)}
.release-count{font-size:14px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums;line-height:1.5}.release-date{font-size:11px;color:var(--muted)}
.release-actions{display:flex;gap:5px;margin-top:5px}.release-actions .btn{padding:4px 7px;font-size:12px}.release-empty{color:var(--muted);font-size:13px;padding:8px 0}
@media(max-width:700px){.release-form{grid-template-columns:1fr 1fr}.release-form select{grid-column:1/-1}.release-form button{grid-column:1/-1}.release-list{grid-template-columns:1fr}}
/* Release schedule opens from a header button instead of occupying the home page. */
#releaseModal{display:none;position:fixed;inset:0;z-index:10001;background:#05040bd9;backdrop-filter:blur(7px);padding:18px;overflow-y:auto;align-items:center;justify-content:center}
#releaseModal.open{display:flex}
#releaseModal .release-dialog{width:min(100%,1050px);max-height:calc(100vh - 36px);overflow:auto;position:relative;background:var(--bg);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--panel2));border-radius:18px;padding:18px;box-shadow:0 24px 90px #0008}
#releaseModal .release-close{position:sticky;top:0;float:right;z-index:2;border:1px solid var(--panel2);background:var(--panel);color:var(--text);border-radius:10px;padding:7px 11px;cursor:pointer}
#releaseModal .release-panel{margin:0;padding:8px 0 0;border:0;background:transparent}
#releaseBtn{white-space:nowrap}
@media(max-width:640px){#releaseModal{padding:8px}#releaseModal .release-dialog{max-height:calc(100vh - 16px);padding:12px;border-radius:14px}}


.release-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.release-toolbar input{flex:1;min-width:180px;background:var(--panel2);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 24%,var(--panel2));border-radius:10px;padding:10px 12px;font:inherit}
.release-updated,.release-source{font-size:12px;color:var(--muted)}
.release-source{margin-top:10px}
.release-actions{display:flex;gap:8px;flex-wrap:wrap}

</style>
</head>
<body>
<div id="bar"></div>
<header class="top">
  <a class="logo" id="logo" href="#/">ZERINET</a>
  <nav id="mnav"><a href="#/">Главная</a><a href="#/fav">♥ Избранное</a><a href="#" id="rand">🎲 Случайное</a></nav>
  <form id="searchForm" autocomplete="off">
    <input id="q" type="search" placeholder="Поиск аниме…" enterkeyhint="search">
    <button class="btn primary" type="submit">Найти</button>
  </form>
  <button class="btn" id="releaseBtn" type="button" aria-haspopup="dialog" aria-controls="releaseModal">⏳ Релизы</button>
  <button class="btn" id="themeBtn" title="Сменить тему" type="button">🎨</button>
</header>
<main id="app"></main>
<div id="releaseModal" aria-hidden="true"><div class="release-dialog" role="dialog" aria-modal="true" aria-labelledby="releaseModalTitle"><button class="release-close" id="releaseClose" type="button" aria-label="Закрыть расписание">✕ Закрыть</button><div id="releaseModalContent"></div></div></div>
<footer>Каталог и видео предоставляет AniLibria API · <a href="#/test">Проверка соединения</a></footer>

<script src="social.js"></script>
<script>
"use strict";
/* ---------- настройки (меняй под себя) ---------- */
const CONFIG = {
  siteName: "ZERINET",
  directApi: "https://anilibria.top/api/v1",   // официальный основной API v1
  mirrors: ["https://api.anilibria.app/api/v1"], // официальное зеркало API v1
  imageBase: "https://anilibria.top",            // база относительных путей изображений
  hlsScript: "https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js",
  homePaths: [                                   // пробуем по очереди, берём первый рабочий
    "/anime/releases/latest?limit=24",
    "/anime/catalog/releases?page=1&limit=24",
  ],
};

document.title = CONFIG.siteName;
document.getElementById("logo").textContent = CONFIG.siteName;

/* ---------- утилиты ---------- */
const $app = document.getElementById("app");
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("zerinet:" + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("zerinet:" + key, JSON.stringify(value)); } catch { /* хранилище может быть выключено */ } },
};
const fixUrl = (url) => !url ? "" : (url.startsWith("/") ? CONFIG.imageBase + url : url);
const posterOf = (release) => {
  const p = release.poster || {}, o = p.optimized || {};
  return fixUrl(o.preview || p.preview || o.src || p.src || o.thumbnail || p.thumbnail || "");
};
const titleOf = (release) => release.name?.main || release.name?.english || release.alias || "Без названия";
const toList = (json) => Array.isArray(json) ? json : (Array.isArray(json?.data) ? json.data : []);
const unwrap = (json) => (json && typeof json === "object" && !Array.isArray(json) && json.data && typeof json.data === "object" && !Array.isArray(json.data)) ? json.data : json;

/* ---------- API ---------- */
const bases = location.protocol === "file:" ? [CONFIG.directApi, ...CONFIG.mirrors] : ["/aniapi", CONFIG.directApi, ...CONFIG.mirrors];
let workingBase;
async function api(path, signal) {
  const order = workingBase ? [workingBase, ...bases.filter((b) => b !== workingBase)] : bases;
  let lastError;
  for (const base of order) {
    try {
      const response = await fetch(base + path, { signal, headers: { Accept: "application/json" } });
      const isJson = (response.headers.get("content-type") || "").includes("json");
      if (response.status === 404 && isJson) { const e = new Error("not found"); e.status = 404; throw e; }
      if (!response.ok || !isJson) throw new Error("HTTP " + response.status);
      workingBase = base;
      return await response.json();
    } catch (error) {
      if (error.name === "AbortError" || error.status === 404) throw error;
      lastError = error;
    }
  }
  throw lastError || new Error("API недоступен");
}

/* ---------- hls.js ---------- */
let hlsPromise;
function loadHls() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (hlsPromise) return hlsPromise;
  hlsPromise = new Promise((resolve) => {
    const script = document.createElement("script");
    script.src = CONFIG.hlsScript; script.async = true;
    script.onload = () => resolve(window.Hls);
    script.onerror = () => { hlsPromise = undefined; resolve(undefined); };
    document.head.append(script);
  });
  return hlsPromise;
}

/* ---------- экраны ---------- */
let controller; // отмена запросов при смене экрана
let cleanup = () => {};

function newScreen() {
  controller?.abort();
  cleanup(); cleanup = () => {};
  controller = new AbortController();
  return controller.signal;
}

const enc = encodeURIComponent;
const aliasOf = (r) => r.alias || r.id;
const CATALOG = (page) => `/anime/catalog/releases?page=${page}&limit=24`;
let pool = [];   // загруженные тайтлы — из них берётся «Случайное»

/* ---------- избранное и история (хранятся в браузере) ---------- */
const slim = (r) => ({ alias: aliasOf(r), title: titleOf(r), poster: posterOf(r), year: r.year });
const fromSlim = (h) => ({ alias: h.alias, name: { main: h.title }, poster: { src: h.poster }, year: h.year });
const favs = () => store.get("fav", []);
const isFav = (alias) => favs().some((f) => f.alias === alias);
function toggleFav(release) {
  const alias = aliasOf(release);
  const list = isFav(alias) ? favs().filter((f) => f.alias !== alias) : [slim(release), ...favs()];
  store.set("fav", list.slice(0, 300));
  return isFav(alias);
}
function pushHistory(release, ep, time) {
  const list = store.get("history", []).filter((h) => h.alias !== aliasOf(release));
  list.unshift({ ...slim(release), ep, time: Math.floor(time || 0) });
  store.set("history", list.slice(0, 20));
}

function startHero() {
  const hero = document.getElementById("hero");
  if (!hero) return;
  const slides = [...hero.querySelectorAll(".slide")], dots = [...hero.querySelectorAll(".dots button")];
  let current = 0, timer;
  const show = (i) => {
    current = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle("on", k === current));
    dots.forEach((d, k) => d.classList.toggle("on", k === current));
  };
  const restart = () => { clearInterval(timer); timer = setInterval(() => show(current + 1), 6500); };
  dots.forEach((d, k) => d.addEventListener("click", () => { show(k); restart(); }));
  if (slides.length > 1) restart();
  const previous = cleanup;
  cleanup = () => { clearInterval(timer); previous(); };
}

function startReleaseTracker(items) {
  const root = document.getElementById("releaseTracker");
  if (!root) return;
  const list = root.querySelector("#releaseList"), search = root.querySelector("#releaseSearch"), refresh = root.querySelector("#releaseRefresh"), updated = root.querySelector("#releaseUpdated");
  let schedule = [], loading = false, errorText = "";
  const titleFor = (m) => m?.title?.english || m?.title?.romaji || m?.title?.native || "Аниме без названия";
  const formatRemaining = (unix) => {
    const diff = Number(unix) * 1000 - Date.now();
    if (!Number.isFinite(diff)) return "Время выхода неизвестно";
    if (diff <= 0) return "Серия уже должна выйти — обновляем данные";
    const total = Math.floor(diff / 1000), days = Math.floor(total / 86400), hours = Math.floor(total % 86400 / 3600), mins = Math.floor(total % 3600 / 60), secs = total % 60;
    return `Через ${days ? `${days} дн. ` : ""}${String(hours).padStart(2,"0")}ч ${String(mins).padStart(2,"0")}м ${String(secs).padStart(2,"0")}с`;
  };
  const dateLabel = (unix) => new Date(Number(unix) * 1000).toLocaleString("ru-RU", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  const render = () => {
    const q = (search.value || "").trim().toLocaleLowerCase("ru");
    const rows = schedule.filter(x => titleFor(x.media).toLocaleLowerCase("ru").includes(q));
    if (!rows.length) {
      list.innerHTML = `<div class="release-empty">${errorText ? esc(errorText) : (q ? "Ничего не найдено по этому запросу." : "В расписании пока нет ближайших серий. Попробуй обновить позже.")}</div>`;
      return;
    }
    list.innerHTML = rows.map(x => {
      const m = x.media || {}, title = titleFor(m), poster = m.coverImage?.extraLarge || m.coverImage?.large || "";
      const episode = Number(x.episode) || "?";
      return `<article class="release-item">
        <img class="release-poster" src="${esc(poster)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="release-info"><div class="release-title" title="${esc(title)}">${esc(title)}</div>
        <div class="release-episode">Следующая серия: ${esc(String(episode))}${m.episodes ? ` / ${esc(String(m.episodes))}` : ""} · ${m.status === "RELEASING" ? "Выходит сейчас" : "Анонс"}</div>
        <div class="release-count" data-countdown="${Number(x.airingAt)}">${formatRemaining(x.airingAt)}</div>
        <div class="release-date">${esc(dateLabel(x.airingAt))} · по времени вашего устройства</div>
        <div class="release-actions">${m.siteUrl ? `<a class="btn" href="${esc(m.siteUrl)}" target="_blank" rel="noopener noreferrer">Подробнее</a>` : ""}</div></div>
      </article>`;
    }).join("");
  };
  const load = async () => {
    if (loading) return;
    loading = true; refresh.disabled = true; updated.textContent = "Обновляем расписание…"; errorText = "";
    try {
      const query = `query { Page(page: 1, perPage: 50) { airingSchedules(notYetAired: true, sort: TIME) { airingAt timeUntilAiring episode media { id title { english romaji native } coverImage { extraLarge large } episodes status siteUrl } } } }`;
      const response = await fetch("https://graphql.anilist.co", {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify({query}), signal: AbortSignal.timeout(12000)});
      if (!response.ok) throw new Error("Сервис расписания временно недоступен (" + response.status + ")");
      const json = await response.json();
      if (json.errors?.length) throw new Error("Сервис расписания не вернул данные");
      schedule = (json.data?.Page?.airingSchedules || []).filter(x => x.media && x.airingAt && x.airingAt * 1000 > Date.now()).sort((a,b) => a.airingAt-b.airingAt);
      if (!schedule.length) errorText = "Не удалось найти ближайшие релизы. Попробуй обновить позже.";
      updated.textContent = "Обновлено: " + new Date().toLocaleTimeString("ru-RU", {hour:"2-digit",minute:"2-digit"});
      render();
    } catch (e) {
      errorText = "Не удалось загрузить онлайн-расписание. Проверь интернет и нажми «Обновить».";
      updated.textContent = "Нет соединения с расписанием"; render();
    } finally { loading = false; refresh.disabled = false; }
  };
  search.addEventListener("input", render);
  refresh.addEventListener("click", load);
  render(); load();
  const timer = setInterval(() => {
    root.querySelectorAll("[data-countdown]").forEach(el => { el.textContent = formatRemaining(el.dataset.countdown); });
    if (schedule.length && schedule.some(x => x.airingAt * 1000 <= Date.now())) load();
  }, 1000);
  const autoRefresh = setInterval(load, 10 * 60 * 1000);
  const previous = cleanup;
  cleanup = () => { clearInterval(timer); clearInterval(autoRefresh); previous(); };
}

  const syncHash = () => history.replaceState(null, "", opts.room ? `#/room/${opts.room}` : `#/title/${encodeURIComponent(release.alias || alias)}/${index + 1}`);

  function renderControls() {
    $("prev").disabled = index <= 0;

    } catch (error) {
      if (error.name === "AbortError" || token !== loadToken) return;
      stream = episode; // ссылки из самого релиза, если есть

    const url = active && stream?.[active];

  async function kodikInit() {

      const response = await fetch(`/kodik/search?title=${encodeURIComponent(name)}&types=anime,anime-serial&with_material_data=true&limit=100`, { signal });

        let reason = "";
        try { const body = await response.json(); reason = body.error || body.message || ""; } catch { /* тело не JSON */ }
        const hint = response.status === 401 || response.status === 403 ? " — Kodik не принял токен, проверь kodik_token.txt" : "";
        throw new Error("HTTP " + response.status + (reason ? ": " + reason : "") + hint);
      }
      const json = await response.json();
      results = Array.isArray(json.results) ? json.results : [];
      if (results.length) break;
    }
    const groups = new Map();
    for (const r of results) {
      const key = r.shikimori_id || r.kinopoisk_id || r.id;
      if (!groups.has(key)) groups.set(key, { title: r.title || r.title_orig || "Без названия", year: r.year, items: [] });
      const group = groups.get(key);
      if (!group.items.some((x) => x.translation?.id === r.translation?.id)) group.items.push(r);
    }
    kGroups = [...groups.values()].sort((a, b) => (b.year === release.year) - (a.year === release.year));
    const savedVoice = store.get("voice", "");
    kVoice = Math.max(0, kGroups[0]?.items.findIndex((r) => r.translation?.title === savedVoice) ?? 0);
  }

  function kodikSrc(item) {
    const url = new URL(String(item.link).startsWith("//") ? "https:" + item.link : item.link);
    url.searchParams.set("translations", "true");
    if (item.type !== "anime") {             // сериал: сразу открываем нужную серию
      url.searchParams.set("episode", index + 1);
      if (item.last_season) url.searchParams.set("season", item.last_season);
    }
    return url.toString();
  }

  function renderKodik() {
    const group = kGroups[kGroup];
    $("kTitle").innerHTML = kGroups.map((g, i) => `<option value="${i}">${esc(g.title)}${g.year ? ` (${esc(g.year)})` : ""}</option>`).join("");
    $("kTitle").hidden = kGroups.length < 2; $("kTitle").value = String(kGroup);
    $("kVoice").innerHTML = group.items.map((r, i) => `<option value="${i}">${esc(r.translation?.title || "Озвучка")}${r.translation?.type === "subtitles" ? " (субтитры)" : ""}</option>`).join("");
    kVoice = Math.min(kVoice, group.items.length - 1);
    $("kVoice").value = String(kVoice);
    frame.src = kodikSrc(group.items[kVoice]);
    syncHash(); pushHistory(release, index + 1, 0); renderControls();
  }

  async function setSource(next) {
    source = next; store.set("source", next);
    renderControls();
    if (next === "kodik") {
      loadToken++; hls?.destroy(); hls = undefined;
      video.pause(); video.removeAttribute("src"); video.load();
      video.hidden = true; frame.hidden = false; skip.hidden = true; $("kodikRow").hidden = false;
      say("Ищем в Kodik…");
      try { await kodikInit(); } catch (error) { if (source === "kodik") say("Kodik недоступен: " + error.message); return; }
      if (source !== "kodik") return;
      if (!kGroups.length) { say("В Kodik это аниме не нашлось"); $("kodikRow").hidden = true; return; }
      say(""); renderKodik();
    } else {
      frame.hidden = true; frame.removeAttribute("src"); video.hidden = false; $("kodikRow").hidden = true;
      play();
    }
  }

  let remote = false;  // true, когда серию переключает комната, а не сам пользователь
  const roomCtx = {
    video, container: $("roomHost"), count: episodes.length,
    getIndex: () => index, onEpisode: undefined,
    ready: () => source === "ani" && video.readyState >= 1,
    setEpisode(i) { remote = true; try { go(i); } finally { remote = false; } },
  };
  function go(next) {
    index = next;
    if (source === "kodik" && kGroups?.length) renderKodik(); else if (source === "ani") play();
    if (!remote) roomCtx.onEpisode?.(next);
  }

  const inside = (t, r) => typeof r?.start === "number" && typeof r?.stop === "number" && t >= r.start && t < r.stop;
  let lastSave = 0;
  video.addEventListener("timeupdate", () => {
    const t = video.currentTime;
    const kind = inside(t, stream?.opening) ? "opening" : inside(t, stream?.ending) ? "ending" : undefined;
    skip.hidden = !kind; skip.dataset.kind = kind || "";
    skip.textContent = kind === "opening" ? "Пропустить опенинг" : "Пропустить эндинг";
    if (Date.now() - lastSave > 5000) { lastSave = Date.now(); store.set("progress:" + (release.alias || alias), { ep: index + 1, time: Math.floor(t) }); pushHistory(release, index + 1, t); }
  });
  video.addEventListener("ended", () => { if (index < episodes.length - 1) go(index + 1); });
  skip.addEventListener("click", () => { const r = skip.dataset.kind === "opening" ? stream?.opening : stream?.ending; if (typeof r?.stop === "number") video.currentTime = r.stop; });
  $("prev").addEventListener("click", () => { if (index > 0) go(index - 1); });
  $("next").addEventListener("click", () => { if (index < episodes.length - 1) go(index + 1); });
  $("eps").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) go(Number(b.dataset.i)); });
  $("qualities").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-q]");
    if (!b) return;
    quality = b.dataset.q; store.set("quality", quality);
    resumeTime = video.currentTime; play();
  });
  $("sourceRow").addEventListener("click", (e) => { const b = e.target.closest("button[data-s]"); if (b && b.dataset.s !== source) setSource(b.dataset.s); });
  $("kTitle").addEventListener("change", (e) => { kGroup = Number(e.target.value); kVoice = 0; renderKodik(); });
  $("kVoice").addEventListener("change", (e) => {
    kVoice = Number(e.target.value);
    store.set("voice", kGroups[kGroup].items[kVoice].translation?.title || "");
    renderKodik();
  });
  cleanup = () => { loadToken++; hls?.destroy(); video.pause(); frame.removeAttribute("src"); };
  window.zSocial?.mountCritic?.(document.getElementById("critic"), release.alias || alias);
  setSource(source);
  if (opts.room) window.zSocial?.attachRoom?.(opts.room, roomCtx);
}

/* ---------- проверка соединения (#/test) ---------- */
async function showTest() {
  newScreen();
  $app.innerHTML = `<h2>Проверка соединения</h2>
    <div class="box"><pre id="tlog" style="white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.5 ui-monospace,monospace">Проверяем…</pre></div>
    <div class="row"><button class="btn primary" id="tcopy">Скопировать отчёт</button><a class="btn" href="#/">На главную</a></div>`;
  const lines = [];
  const out = document.getElementById("tlog");
  const log = (ok, text) => { lines.push((ok === undefined ? "• " : ok ? "✅ " : "❌ ") + text); out.textContent = lines.join("\n"); };
  document.getElementById("tcopy").addEventListener("click", async () => {
    const text = lines.join("\n");
    try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    document.getElementById("tcopy").textContent = "Скопировано ✔";
  });
  const probe = async (label, url, kind) => {
    const started = performance.now();
    try {
      const r = await fetch(url, { headers: kind === "json" ? { Accept: "application/json" } : {} });
      const type = (r.headers.get("content-type") || "").split(";")[0];
      const ms = Math.round(performance.now() - started);
      if (kind === "json") {
        const j = type.includes("json") ? await r.json().catch(() => undefined) : undefined;
        const n = Array.isArray(j) ? j.length : Array.isArray(j?.data) ? j.data.length : undefined;
        log(r.ok && j !== undefined, `${label}: HTTP ${r.status}, ${type || "?"}${n !== undefined ? ", записей: " + n : ""} (${ms} мс)`);
        return r.ok ? j : undefined;
      }
      const head = (await r.text()).slice(0, 7);
      log(r.ok && head.startsWith("#EXTM3U"), `${label}: HTTP ${r.status}, начало: ${JSON.stringify(head)} (${ms} мс)`);
      return r.ok;
    } catch (error) {
      log(false, `${label}: ${error.name}: ${error.message}  ← обычно это блок CORS или нет сети`);
    }
  };
  log(undefined, "Страница: " + location.origin + " · " + (location.protocol === "file:" ? "открыта как файл" : "по ссылке"));
  log(undefined, "Браузер: " + navigator.userAgent);
  log(undefined, "— 1. Доступ к API AniLibria —");
  for (const base of bases) await probe(`${base} (поиск)`, base + "/app/search/releases?query=naruto", "json");
  log(undefined, "— 2. Адреса списка «новинки» —");
  for (const path of CONFIG.homePaths) await probe(path, (workingBase || bases[0]) + path, "json");
  log(undefined, "— 3. Серия и видео —");
  try {
    const found = toList(await api("/app/search/releases?query=naruto"));
    const release = unwrap(await api("/anime/releases/" + encodeURIComponent(found[0].alias || found[0].id)));
    const episode = unwrap(await api("/anime/releases/episodes/" + encodeURIComponent(release.episodes[0].id)));
    log(true, `Релиз «${titleOf(release)}», серий: ${release.episodes.length}`);
    log(!!(episode.hls_480 || episode.hls_720 || episode.hls_1080), "Ссылки на видео: " + ["hls_480", "hls_720", "hls_1080"].filter((k) => episode[k]).join(", "));
    log(undefined, "Поля релиза: " + Object.keys(release).join(", "));
    log(undefined, "Обложка: " + (posterOf(release) || "не нашлась") + " · поля серии: " + Object.keys(episode).join(", "));
    const url = episode.hls_480 || episode.hls_720 || episode.hls_1080;
    if (url) await probe("Плейлист видео (.m3u8)", url, "text");
  } catch (error) {
    log(false, "Не удалось пройти путь поиск → релиз → серия: " + error.message);
  }
  log(undefined, "— 4. Плеер —");
  const Hls = await loadHls();
  log(!!Hls, Hls ? `hls.js загрузился, поддержка MSE: ${Hls.isSupported() ? "да" : "нет"}` : "hls.js не загрузился (блокировщик или нет интернета)");
  log(undefined, "Нативный HLS: " + (document.createElement("video").canPlayType("application/vnd.apple.mpegurl") ? "да" : "нет"));
  log(undefined, "Готово. Нажми «Скопировать отчёт» и пришли мне.");
}

/* ---------- маршрутизация ---------- */
const bar = document.getElementById("bar");
function route() {
  bar.className = ""; void bar.offsetWidth; bar.className = "on";
  return Promise.resolve(routeInner()).finally(() => { bar.className = "done"; });
}
document.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  const card = e.target.closest?.(".card");
  if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty("--ry", (((e.clientX - r.left) / r.width - 0.5) * 9).toFixed(1) + "deg");
  card.style.setProperty("--rx", (-((e.clientY - r.top) / r.height - 0.5) * 9).toFixed(1) + "deg");
});
document.addEventListener("pointerout", (e) => {
  const card = e.target.closest?.(".card");
  if (card && !card.contains(e.relatedTarget)) { card.style.removeProperty("--rx"); card.style.removeProperty("--ry"); }
});
function routeInner() {
  const hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const parts = hash.split("/");
  if (parts[0] === "test") return showTest();
  if (parts[0] === "fav") return showFav();
  const custom = window.zRoutes?.[parts[0]];
  if (custom) return custom(parts);
  if (parts[0] === "title" && parts[1]) return showTitle(parts[1], parts[2]);
  if (parts[0] === "search" && parts[1]) return showSearch(parts.slice(1).join("/"));
  return showHome();
}
window.zApp = {
  get app() { return $app; }, newScreen, showTitle, reroute: () => route(),
  setCleanup(fn) { cleanup = fn; },
  addCleanup(fn) { const previous = cleanup; cleanup = () => { fn(); previous(); }; },
};
window.addEventListener("hashchange", route);
document.getElementById("searchForm").addEventListener("submit", (event) => {
  event.preventDefault();
  const query = document.getElementById("q").value.trim();
  if (query) location.hash = "#/search/" + encodeURIComponent(query);
});
const releaseModal = document.getElementById("releaseModal");
const releaseBtn = document.getElementById("releaseBtn");
const closeReleaseModal = () => { releaseModal.classList.remove("open"); releaseModal.setAttribute("aria-hidden", "true"); releaseBtn.setAttribute("aria-expanded", "false"); };
releaseBtn.setAttribute("aria-expanded", "false");
releaseBtn.addEventListener("click", () => {
  const opening = !releaseModal.classList.contains("open");
  releaseModal.classList.toggle("open", opening);
  releaseModal.setAttribute("aria-hidden", String(!opening));
  releaseBtn.setAttribute("aria-expanded", String(opening));
});
document.getElementById("releaseClose").addEventListener("click", closeReleaseModal);
releaseModal.addEventListener("click", (event) => { if (event.target === releaseModal) closeReleaseModal(); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeReleaseModal(); });
route();


// Decorative falling leaves. This overlay does not affect navigation or page controls.
(function addZerinetFallingLeaves(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (document.getElementById("zr-falling-leaves")) return;
  const layer = document.createElement("div");
  layer.id = "zr-falling-leaves";
  layer.setAttribute("aria-hidden", "true");
  const palettes = [
    ["#ffd166", "#f59e0b", "#b45309"],
    ["#ffb86b", "#ea580c", "#9a3412"],
    ["#fca5a5", "#ef4444", "#991b1b"],
    ["#fde68a", "#d97706", "#92400e"],
    ["#d9f99d", "#84cc16", "#3f6212"]
  ];
  for (let i = 0; i < 24; i++) {
    const leaf = document.createElement("i");
    const colors = palettes[Math.floor(Math.random() * palettes.length)];
    leaf.className = "zr-fall-leaf";
    leaf.style.setProperty("--left", (Math.random() * 100) + "%");
    leaf.style.setProperty("--size", (9 + Math.random() * 13) + "px");
    leaf.style.setProperty("--angle", (Math.random() * 360) + "deg");
    leaf.style.setProperty("--duration", (9 + Math.random() * 13) + "s");
    leaf.style.setProperty("--delay", (-Math.random() * 22) + "s");
    leaf.style.setProperty("--sway", (20 + Math.random() * 70) + "px");
    leaf.style.setProperty("--opacity", (0.38 + Math.random() * 0.4).toFixed(2));
    leaf.style.setProperty("--leaf-light", colors[0]);
    leaf.style.setProperty("--leaf-color", colors[1]);
    leaf.style.setProperty("--leaf-dark", colors[2]);
    layer.appendChild(leaf);
  }
  document.body.appendChild(layer);
})();
